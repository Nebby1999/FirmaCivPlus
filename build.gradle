buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

     enableIdeaPrepareRuns = true
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'INFO'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('runs/client')

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('runs/server')

            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('runs/game-test')

            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('runs/data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args (
                    '--mod',
                    mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/'),
                    '--existing',
                    file('src/main/resources/'),
                    '--existing-mod',
                    'alekiships',
                    '--existing-mod',
                    'afc',
                    '--existing-mod',
                    'beneath',
                    '--existing-mod',
                    'firmaciv',
                    '--existing-mod',
                    'alekiroofs'
            )
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository) // Only add this if you're using ForgeGradle, otherwise remove this line
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
            includeGroup("com.simibubi.create")
        }
    }

    maven { url "https://maven.shedaniel.me/" }

    maven {
        url "https://squiddev.cc/maven/"
        content {
            includeGroup("cc.tweaked")
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    // Create, Ponder, Flywheel
    maven {
        url = "https://maven.createmod.net"
    }

    // location of a maven mirror for JEI files, as a fallback
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup("com.simibubi.create")
            includeGroup("dev.engine-room.flywheel")
        }
    }

    // GTM
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'appeng'
        }
    }

    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    implementation fg.deobf("maven.modrinth:architectury-api:9.2.14+forge")
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
    implementation fg.deobf("curse.maven:configuration-444699:4710266")

    implementation fg.deobf("maven.modrinth:embeddium:0.3.31+mc1.20.1")
    implementation fg.deobf("maven.modrinth:ferrite-core:DG5Fn9Sz")

    // JEI
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-common-api:15.3.0.7"))
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.3.0.7"))
    // at runtime, use the full JEI jar for Forge
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-forge:15.3.0.7"))

    // KJS
    implementation fg.deobf("maven.modrinth:rhino:2001.2.2-build.18+forge")
    implementation fg.deobf("maven.modrinth:kubejs:2001.6.5-build.7+forge")

    //EMI
    implementation fg.deobf("dev.emi:emi-forge:1.1.13+1.20.1")

    // TFC
    implementation fg.deobf("maven.modrinth:patchouli:1.20.1-84.1-forge") { transitive = false }
    implementation fg.deobf("maven.modrinth:terrafirmacraft:3.2.22") { transitive = false }

    // Beneath
    implementation fg.deobf("maven.modrinth:beneath:1.0.6") { transitive = false }

    // FirmaCiv
    implementation fg.deobf("maven.modrinth:firmaciv:1.0.9");

    //Alekiships
    implementation fg.deobf("maven.modrinth:alekiships:1.0.14")

    //AlekiRoofs
    implementation (jarJar(fg.deobf("curse.maven:alekis-ridiculously-simple-roofs-1010046:5310531"))) {
        jarJar.ranged(it as Dependency, "[1.0,)")
    }

    // ArborFirmaCraft
    implementation fg.deobf("maven.modrinth:arborfirmacraft-(afc):1.0.22-1.20.1")

    // Jade
    implementation fg.deobf("maven.modrinth:jade:11.13.2+forge")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.6"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.6")) {
        jarJar.ranged(it, "[0.3.6,)")
    }

    // TFG
    implementation fg.deobf("curse.maven:terrafirmagreg-core-513402:8307533")

    // TFG Dependencies
    // Create
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:1.0.5")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:1.0.5")
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:6.0.8-289:slim") { transitive = false }
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:1.0.91")

    // Create: Vintage Improvements
    implementation fg.deobf("curse.maven:vintage-improvements-ssw-edition-1255448:7783979") { transitive = false }

    // Greate
    runtimeOnly fg.deobf("curse.maven:copycats-968398:7634682")
    runtimeOnly fg.deobf("curse.maven:create-repair-1477958:8034105")
    implementation fg.deobf("maven.modrinth:greate:0.0.78") { transitive = false }

    // GTM
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:7.5.3") { transitive = false }

    // TFC
    implementation fg.deobf("curse.maven:kubejs-tfc-841001:8283526") { transitive = false }

    // FirmaLife
    implementation fg.deobf("maven.modrinth:firmalife:2.1.27")

    // TFC AstikorCarts
    implementation fg.deobf("curse.maven:astikor-carts-redux-916493:4988266") { transitive = false }
    implementation fg.deobf("curse.maven:astikor-carts-tfc-844019:5141430") { transitive = false }

    // TFC hot or not
    implementation fg.deobf("curse.maven:tfc-hot-or-not-499096:6047294") { transitive = false }

    // TFC Roads and Roofs
    implementation fg.deobf("curse.maven:roads-and-roofs-tfc-1048212:8099778")

    // AE2
    implementation fg.deobf("curse.maven:guideme-1173950:7013686")
    implementation fg.deobf("curse.maven:applied-energistics-2-wireless-terminals-459929:7014805")
    implementation fg.deobf("curse.maven:cloth-config-348521:5729105")

    // Ad Astra
    implementation fg.deobf("curse.maven:ad-astra-635042:6262032") { transitive = false }
    implementation fg.deobf("curse.maven:botarium-704113:5486070") { transitive = false }
    implementation fg.deobf("curse.maven:resourceful-lib-570073:5659871") { transitive = false }
    implementation fg.deobf("curse.maven:resourceful-config-714059:6231176") { transitive = false }

    // Species
    implementation fg.deobf("maven.modrinth:species:3.5") { transitive = false }

    // Wan's ancient beasts
    implementation fg.deobf("curse.maven:wans-ancient-beasts-1108604:8217197")
    implementation fg.deobf("curse.maven:geckolib-388172:7553267")

    // Create Liquid Fuel
    implementation fg.deobf("curse.maven:create-liquid-fuel-840734:5217310")

    // Dea's Fission Vazde
    implementation fg.deobf("curse.maven:deafission-1354541:7633771")

    // Create Picky Waterwheels
    implementation fg.deobf("curse.maven:create-picky-waterwheels-866839:6932328")

    // TFCGenViewer
    implementation fg.deobf("maven.modrinth:tfcgenviewer:1.5.1")

    // Crafting Station Improved
    implementation fg.deobf("curse.maven:crafting-station-improved-1310299:7463065")

    // Strut Your Stuff
    implementation fg.deobf("maven.modrinth:strut-your-stuff:1.1.0+mc1.20.1")

    // Curios
    implementation fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
